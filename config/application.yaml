apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-app-argo-config
  namespace: argocd
spec:
  project: itd-k8s
  source:
    repoURL: https://github.com/barkikaveri007/argocd.git
    targetRevision: main
    path: argocd/config
  destination:
    server: https://54.160.158.106:6443
    namespace: default
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
